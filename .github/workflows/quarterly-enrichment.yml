name: Quarterly Contact Enrichment

on:
  schedule:
    # First Monday of Feb, May, Aug, Nov at 1pm UTC (8am ET) — fiscal quarters
    - cron: "0 13 1-7 2,5,8,11 1"
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        options:
          - push
          - process
          - metrics
        default: push
      dry_run:
        description: "Dry run (log only, no changes)"
        type: boolean
        default: false
      test_limit:
        description: "Test mode: limit to N contacts (0 = no limit)"
        type: number
        default: 0

jobs:
  push-to-clay:
    if: >-
      github.event_name == 'schedule' ||
      inputs.phase == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Phase A — Push contacts to Clay
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          CLAY_WEBHOOK_BATCH_0: ${{ vars.CLAY_WEBHOOK_BATCH_0 }}
          CLAY_WEBHOOK_BATCH_1: ${{ vars.CLAY_WEBHOOK_BATCH_1 }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: >-
          python -m src.main --phase push
          ${{ inputs.test_limit > 0 && format('--test {0}', inputs.test_limit) || '' }}

  process-results:
    if: inputs.phase == 'process'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Phase B — Process enrichment results
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m src.main --phase process

  metrics:
    if: inputs.phase == 'metrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Accuracy metrics report
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
        run: python -m src.main --phase metrics
