name: Quarterly Contact Enrichment

on:
  schedule:
    # First Monday of Feb, May, Aug, Nov at 1pm UTC (8am ET) — fiscal quarters
    - cron: "0 13 1-7 2,5,8,11 1"
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        options:
          - push
          - stamp-sent
          - process
          - metrics
        default: push
      dry_run:
        description: "Dry run (log only, no changes)"
        type: boolean
        default: false
      test_limit:
        description: "Test mode: limit to N contacts (0 = no limit)"
        type: number
        default: 0
      preview:
        description: "Preview mode: show Phase B results without writing"
        type: boolean
        default: false
      resume:
        description: "Resume push: skip clear/stamp/reconcile"
        type: boolean
        default: false

jobs:
  push-generate-csvs:
    if: >-
      github.event_name == 'schedule' ||
      inputs.phase == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Phase A — Generate CSVs for Clay
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
          OUTPUT_DIR: output
        run: >-
          python -m src.main --phase push
          ${{ inputs.test_limit > 0 && format('--test {0}', inputs.test_limit) || '' }}
          ${{ inputs.resume && '--resume' || '' }}

      - name: Upload CSVs as artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: clay-csvs
          path: output/*.csv
          retention-days: 30

  stamp-sent:
    if: inputs.phase == 'stamp-sent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stamp enrichment records as Sent
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.main --phase stamp-sent

  process-results:
    if: inputs.phase == 'process'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Phase B — Process enrichment results
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: >-
          python -m src.main --phase process
          ${{ inputs.preview && '--preview' || '' }}

  metrics:
    if: inputs.phase == 'metrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Accuracy metrics report
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.main --phase metrics

      - name: Commit metrics report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/metrics.html
          git diff --cached --quiet || git commit -m "Update metrics report — $(python -c 'from src.config import get_fiscal_quarter; print(get_fiscal_quarter())')"
          git push
